; OneKey BLE Keyboard — PlatformIO Configuration
; ================================================
; Build & upload with:  pio run -t upload
; Serial monitor:       pio device monitor
;
; If using Arduino IDE instead, open firmware/one_key_keyboard.ino directly.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Uncomment for original ESP32 (non-S3) boards:
; [env:esp32]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;     t-vk/ESP32 BLE Keyboard@^0.3.2
